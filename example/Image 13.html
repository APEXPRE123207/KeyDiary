g-surface px-margin"><div class="flex flex-col w-full max-w-md mx-auto items-center justify-between pb-6 px-1 select-none">
<!-- Top Archival Status Pill -->
<div class="w-full flex items-center justify-between pt-1 pb-4">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low shadow-sm">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium tracking-wide">Encrypted AES-256</span>
</div>
<div class="inline-flex items-center gap-1 text-on-surface-variant/80 px-2.5 py-1 rounded-full bg-surface-container-low shadow-sm">
<span class="material-symbols-outlined text-[16px] text-primary">verified_user</span>
<span class="font-label-sm text-label-sm font-medium">Family Registry</span>
</div>
</div>
<!-- Emblem & Welcome Header -->
<div class="flex flex-col items-center text-center mt-1 mb-5 relative">
<div class="relative flex items-center justify-center mb-3">
<div class="absolute -inset-2.5 rounded-full bg-primary-fixed-dim/25 blur-md animate-pulse"></div>
<div class="relative w-20 h-20 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center p-3">
<img alt="KeyDiary Vault Emblem" class="w-full h-full object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1U1ezehJFciOy9GSSoe1aPpNKcDtIBQiAyPBIXjyeGYndF3RavUoaa-jTtuPWckHB3tus9sgCAQPY5EenhOBCA5aTmRoHlWUa2eIC4H4QhSDLpqq-dDdfSnZHv6ukMVfUnoOQvM-Ib82RsDxECAzXCn2f1PGnrDSeMhhfkTAGD-PbA6J8G1X2FbsannvktsMXEMYIl0CxcuLa3WgxzBpXt_GBaTlRYnWaGQsRcTWvIYM-Qau7GTH-MiLe0"/>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">
      Welcome back, Dad
    </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 max-w-[260px]">
      Your family vault is encrypted and strictly private on this device.
    </p>
</div>
<!-- Primary Biometric Sensor Trigger -->
<div class="w-full flex flex-col items-center mb-5">
<div class="relative flex items-center justify-center my-1 group">
<!-- Concentric Aura Waves -->
<div class="absolute w-24 h-24 rounded-full bg-primary/10 animate-ping opacity-70 pointer-events-none"></div>
<div class="absolute w-20 h-20 rounded-full bg-primary-fixed/40 transition-transform duration-500 scale-105 pointer-events-none"></div>
<!-- Sensor Touch Button -->
<button aria-label="Authenticate with biometrics" class="relative z-10 w-16 h-16 rounded-full bg-primary-container text-on-primary shadow-lg flex items-center justify-center active:scale-95 transition-all duration-200" id="biometric-btn" type="button">
<span class="material-symbols-outlined text-[34px] text-on-primary-container">fingerprint</span>
</button>
</div>
<span class="font-label-md text-label-md text-primary mt-2 font-semibold tracking-normal">
      Touch sensor or face unlock
    </span>
<div class="inline-flex items-center gap-1.5 mt-1 text-on-surface-variant">
<span class="material-symbols-outlined text-[15px] text-on-surface-variant">lock</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Protected with on-device biometrics</span>
</div>
</div>
<!-- PIN Entry Fallback & Tactile Pad -->
<div class="w-full bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col items-center mb-4">
<div class="w-full flex items-center justify-between mb-3 px-1">
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Or enter master PIN</span>
<span class="font-label-sm text-label-sm text-primary font-semibold" id="pin-status-label">3 of 4 digits</span>
</div>
<!-- PIN Indicators -->
<div aria-live="polite" class="flex items-center gap-3.5 mb-4 py-1" id="pin-indicator-group">
<div class="w-3.5 h-3.5 rounded-full bg-primary shadow-inner transition-all duration-150 transform scale-110"></div>
<div class="w-3.5 h-3.5 rounded-full bg-primary shadow-inner transition-all duration-150 transform scale-110"></div>
<div class="w-3.5 h-3.5 rounded-full bg-primary shadow-inner transition-all duration-150 transform scale-110"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-high transition-all duration-150"></div>
</div>
<!-- Tactile Keypad -->
<div class="grid grid-cols-3 gap-2.5 w-full max-w-[290px]">
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">1</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">2</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">3</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">4</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">5</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">6</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">7</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">8</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">9</button>
<!-- Biometric Alt Key -->
<button aria-label="Biometric Scan" class="h-12 rounded-lg bg-secondary-fixed text-primary active:bg-primary active:text-on-primary flex items-center justify-center shadow-sm active:scale-95 transition-all" id="key-biometric" type="button">
<span class="material-symbols-outlined text-[24px]">face</span>
</button>
<button class="key-digit h-12 rounded-lg bg-surface-container-low active:bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center shadow-sm active:scale-95 transition-all" type="button">0</button>
<!-- Backspace Key -->
<button aria-label="Delete last digit" class="h-12 rounded-lg bg-surface-container-low text-on-surface-variant active:bg-secondary-container flex items-center justify-center shadow-sm active:scale-95 transition-all" id="key-delete" type="button">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>
</div>
</div>
<!-- Bottom Helper Links -->
<div class="w-full flex flex-col items-center gap-2 mt-auto pt-1">
<button class="w-full py-2.5 px-3 rounded-lg bg-surface-container-low hover:bg-surface-container text-primary font-label-md text-label-md flex items-center justify-center gap-2 shadow-sm transition-colors" id="emergency-access-btn" type="button">
<span class="material-symbols-outlined text-[18px]">family_restroom</span>
<span>Emergency access configured for Soumyadip</span>
</button>
<button class="py-1.5 px-3 text-secondary hover:text-on-surface font-label-md text-label-md underline underline-offset-4 decoration-outline-variant transition-colors" id="forgot-pin-btn" type="button">
      Forgot PIN?
    </button>
</div>
</div>
<script>
  (function() {
    let pinCount = 3;
    const maxDigits = 4;
    const indicators = document.querySelectorAll('#pin-indicator-group > div');
    const statusLabel = document.getElementById('pin-status-label');
    const biometricBtn = document.getElementById('biometric-btn');
    const keyBiometric = document.getElementById('key-biometric');
    const deleteBtn = document.getElementById('key-delete');
    const digitBtns = document.querySelectorAll('.key-digit');

    function updateIndicators() {
      indicators.forEach((dot, idx) => {
        if (idx < pinCount) {
          dot.className = 'w-3.5 h-3.5 rounded-full bg-primary shadow-inner transition-all duration-150 transform scale-110';
        } else {
          dot.className = 'w-3.5 h-3.5 rounded-full bg-surface-container-high transition-all duration-150';
        }
      });

      if (pinCount === maxDigits) {
        statusLabel.textContent = 'Verifying PIN...';
        statusLabel.className = 'font-label-sm text-label-sm text-primary font-bold animate-pulse';
        setTimeout(() => {
          statusLabel.textContent = 'Unlocked';
          indicators.forEach(dot => {
            dot.className = 'w-3.5 h-3.5 rounded-full bg-primary shadow-md transition-all duration-200 transform scale-125';
          });
        }, 350);
      } else {
        statusLabel.textContent = pinCount + ' of 4 digits';
        statusLabel.className = 'font-label-sm text-label-sm text-primary font-semibold';
      }
    }

    digitBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (pinCount < maxDigits) {
          pinCount++;
          updateIndicators();
        }
      });
    });

    deleteBtn.addEventListener('click', () => {
      if (pinCount > 0) {
        pinCount--;
        updateIndicators();
      }
    });

    function triggerBiometricFeedback() {
      biometricBtn.classList.add('scale-95');
      statusLabel.textContent = 'Scanning identity...';
      setTimeout(() => {
        biometricBtn.classList.remove('scale-95');
        statusLabel.textContent = 'Authenticated!';
      }, 400);
    }

    biometricBtn.addEventListener('click', triggerBiometricFeedback);
    keyBiometric.addEventListener('click', triggerBiometricFeedback);
  })();
</script></main></body></html>
