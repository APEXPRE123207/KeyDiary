<script>
  (function () {
    const progress = document.getElementById('splash-progress');
    if (!progress) return;
    
    let position = -30;
    let forward = true;

    function animateBar() {
      if (forward) {
        position += 1.4;
        if (position >= 100) {
          forward = false;
        }
      } else {
        position -= 1.8;
        if (position <= -30) {
          forward = true;
        }
      }
      progress.style.left = position + '%';
      requestAnimationFrame(animateBar);
    }

    requestAnimationFrame(animateBar);
  })();
